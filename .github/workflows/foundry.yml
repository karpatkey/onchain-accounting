name: Foundry

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

# Minimal token scope: jobs only checkout/build/test/fmt; artifact up/download
# uses the Actions runtime token, not GITHUB_TOKEN. (CodeQL: limit GITHUB_TOKEN.)
permissions:
  contents: read

env:
  FOUNDRY_PROFILE: default
  # Single source of truth for the pinned Foundry version (forge's via_ir codegen is version-specific, so this
  # fixes the deterministic CREATE2 library pins — see foundry.toml). Bump here only; every job references it.
  FOUNDRY_VERSION: v1.7.1

jobs:
  # Compile once (via_ir is expensive) + EIP-170 size gate; share artifacts with all test jobs.
  build:
    name: Build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mount forge compilation cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-forge-cache
          path: ./cache

      - name: Mount forge build output
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-forge-out
          path: ./out
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          # cache: false ONLY on this job. The restored Foundry cache lets `forge build` reuse
          # compilation state across runs, and that reuse changes the compilation scope enough to
          # change PriceFeedLib's emitted bytecode — and so the deterministic CREATE2 address the
          # LibraryPinConsistency test derives from it. Three different PriceFeedLib values appeared
          # across branches whose PriceFeedLib source was byte-identical, one of which changed no
          # file under src/ at all; a --force probe recovered the correct value every time.
          #
          # This is the job that matters: it produces the `out/` every test job downloads, so a wrong
          # value here is wrong everywhere downstream. Disabled rather than passing `forge build
          # --force` because it names the cause instead of overriding it — with nothing restored
          # there is no stale state to reuse. Identical compile cost either way.
          #
          # The test jobs keep `cache: true`: they consume this job's `out/` artifact and do not
          # recompile, so their cache cannot affect a pin value.
          cache: false

      # KEPT AS HEADROOM, but the premise below is no longer what it says — corrected rather than deleted,
      # because the reasoning about WHY memory matters here is still the useful part.
      #
      # A whole-program `via_ir` compile of this repo peaks at 7-8 GB RSS (measured locally with
      # `/usr/bin/time -v forge build --sizes` after `forge clean`; one run on a larger box reported 9.7 GB).
      # This comment used to claim `ubuntu-latest`, 2 vCPU / 7 GB, and that the build "does not fit in the
      # runner without it". That was true when written; this job now runs on a Blacksmith runner reporting
      # ~30 GiB RAM with ~11 GiB of swap already active before this step adds 8 more. Against a 7-9.7 GB peak
      # the step is no longer load-bearing — it is margin, and cheap enough to keep while the peak sits this
      # close to a structural ceiling. Do not cite it as a hard requirement, and do not remove it on the
      # grounds that the old justification was wrong; measure the peak on the runner first.
      #
      # A branch that adds even ~1 KB of
      # contract code in the wrong shape tips it, and the failure mode is silent and confusing: the log ends
      # at "Compiling NNN files with Solc 0.8.34" and the step exits 143 (SIGTERM, i.e. the kernel killed
      # solc) with no compiler error at all.
      #
      # The tempting "fixes" are all traps: lowering `optimizer_runs`, disabling `via_ir`, or changing
      # `bytecode_hash` would make the build pass AND silently change library bytecode, which moves the
      # deterministic CREATE2 pins that `foundry.toml [libraries]` and `script/utils/LibraryPins.sol` hard-code.
      # Never trade a pin move for a green build.
      #
      # Swap is slower than RAM but correct, and it fixes every branch at once. A cleaner fix, if the org
      # wants it: this org has Blacksmith runners registered (`blacksmith-4vcpu-ubuntu-2404` through
      # `blacksmith-32vcpu-ubuntu-2404`), so `runs-on:` could point at one with enough RAM and this step
      # could go away.
      - name: Add swap for the via_ir compile
        run: |
          echo "--- before ---"
          free -h
          swapon --show || true
          df -h /mnt | tail -1
          # `ubuntu-latest` already ships an ACTIVE /swapfile, so creating one at that path fails with
          # "fallocate failed: Text file busy" — and it is what main has been squeaking by on. Add a SECOND
          # swap area instead of resizing the existing one (resizing means swapoff first, which needs the
          # pages to fit in RAM and can fail on its own).
          #
          # It goes on /mnt, the runner's large ephemeral disk (~65 GB free), not on / (~20 GB, and shared
          # with the compile's own out/ + cache/ artifacts).
          sudo fallocate -l 8G /mnt/swapfile-ci
          sudo chmod 600 /mnt/swapfile-ci
          sudo mkswap /mnt/swapfile-ci
          sudo swapon /mnt/swapfile-ci
          echo "--- after ---"
          free -h
          swapon --show

      - name: Build
        run: forge build --sizes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-build
          path: |
            out/
            cache/
          retention-days: 1

  # HISTORY — why a separate clean-build `pins` job existed here until #323, and what would bring
  # it back. Kept because the observation below is the only in-tree record of it, and because the
  # reasoning is the argument anyone must defeat before trusting an artifact-derived pin.
  #
  # `build` mounts two Blacksmith sticky disks over `out/` and `cache/`, keyed on
  # `${{ github.repository }}` and nothing else. They are shared by every run of every branch, so
  # `forge build` there is INCREMENTAL against whatever the previous run on that disk left behind
  # — measured at "Compiling 15 files with Solc 0.8.34" against a ~540-file project. The dirty set
  # is computed relative to the last branch that used the disk, NOT to the commit under test, so
  # `build`'s compilation SCOPE is nondeterministic across branches. That is still true today, and
  # it is not hypothetical: a sibling PR's adapter artifact was observed leaking into an unrelated
  # PR's `out/` and failing a test that enumerates it.
  #
  # The pin assertions used to read `type(X).creationCode`, a compile-time constant baked into the
  # asserting test's own bytecode. The recorded observation: with `out/PriceFeedLib.sol/
  # PriceFeedLib.json` on disk implying 0x8b7e4fA9…, the test simultaneously computed 0xeA694009…
  # — two compilations of one unchanged source disagreeing inside a single `out/`. No freshness
  # check could see that, because the sources were unchanged and the standalone artifact was right.
  # Hence a job that compiled the whole program from nothing.
  #
  # WHAT CHANGED. The assertions now read `vm.getCode("X")` — the artifact itself — and
  # `test_pinnedLibraryArtifactsWereBuiltFromThisTree` content-hashes every source all three
  # artifacts record, plus the compiler version and the pin-affecting settings, against this tree.
  # Measured on the PR head before deleting the job: `forge clean && forge build --force` produced
  # creation code byte-identical to the incremental build for all three contracts, and the pin
  # assertions passed from clean.
  #
  # WHAT WOULD BRING IT BACK. Any reading that is NOT of a freshness-checked artifact — in
  # particular a `type(X).creationCode` embedded into an asserting test. Note that
  # `script/test/UpgradeNAVCalculatorPins.t.sol` still embeds it and runs in `unit`; its
  # `test_sourceMatch_tracksRealPinState` deliberately accepts BOTH match and drift, so its green
  # is not evidence either way and must not be cited as such. The pin values themselves are NOT
  # owned by CI: they are `foundry.toml [libraries]` + `script/utils/LibraryPins.sol`, and the
  # authoritative gate remains one clean local full build against the final tree immediately
  # before deploying. A red run here means "regenerate the pins deliberately", never "edit the
  # values until it goes green".
  unit:
    name: Unit tests
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      # LibraryPinConsistencyTest runs HERE again, and the exclusion that used to sit on this line is
      # gone along with the 993 s `pins` job it fed. Both existed for one reason: the assertions read
      # `type(X).creationCode`, embedded at COMPILE time, so under this job's downloaded `out/` they
      # hashed whatever scope the cache had served — the false reds that put `0x8b7e4fA9…` into a real
      # CREATE2 deployment, and that taught the fleet to merge past a red pin check.
      #
      # The assertions now read `vm.getCode("X")` — the artifact this job downloaded — and
      # `test_pinnedLibraryArtifactsWereBuiltFromThisTree` content-hashes every source all three
      # artifacts record, AND their compiler version and pin-affecting settings, against this tree.
      # It gains one thing the embedded form never had: NAVCalculator's artifact was not
      # freshness-checked at all while its creation code was compiled in.
      #
      # It is NOT strictly stronger, and an earlier revision of this comment said it was. Source
      # hashes attest the artifact at a PATH; `vm.getCode` resolves by bare NAME over an `out/` that
      # observably accumulates other branches' artifacts, and nothing binds the two reads to the same
      # file — hence the explicit binding in `_assertArtifactBuiltFromTree`. A foreign artifact that
      # is ADDED rather than modified does not fail a freshness check at all.
      #
      # MEASURED before removing the clean build, because the whole change rests on it: `forge clean
      # && forge build --force` on this head produced creation code byte-identical to the incremental
      # build for all three contracts, and the pin assertions passed from clean. That is the claim
      # this rests on, and it is reproducible with two commands.
      #
      # An earlier revision also asserted that the historical "via_ir scope sensitivity" was a
      # symptom of a missing library self-link fixed by pinning `[libraries]`. That is NOT
      # established: the creation bytecode of PriceFeedLib and NAVRegistryLib contains zero
      # occurrences of either pinned address, so no self-link is present to have been missing, and
      # the repo holds two other mutually inconsistent accounts of the same incident. The mechanism
      # is unknown; the measurement above is what justifies the change, not the diagnosis.
      #
      # If anyone reintroduces an embedded `type(X).creationCode` in that file, this exclusion and the
      # clean-build job have to come back with it. They are one mechanism.
      - name: Unit tests
        env:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: forge test --no-match-path "*fork*" -vvv

  # Per-protocol fork tests (slow profile, RPC). Excludes the NAV integration harness.
  fork:
    name: Fork tests
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      - name: Fork tests
        env:
          FOUNDRY_PROFILE: slow
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: forge test --match-path "*fork*" --no-match-path "test/integration/*" -vvv --threads 1

  # NAV integration tests (5 chains, heavy harness — own job for independent retries).
  integration:
    name: Integration tests
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      - name: Integration tests
        env:
          FOUNDRY_PROFILE: slow
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        run: forge test --match-path "test/integration/*" -vvv --threads 1

  # Verdict truth table for the deploy-funding gate. No network, no secrets, no forge — every RPC read is
  # faked, so this never touches a chain. It exists because `deployer_balances.py` decides whether a
  # redeploy may proceed and previously had NO automated coverage at all: three of its fail-closed guards
  # were re-broken by later edits and caught only by hand. No submodules and no build artifacts needed.
  #
  # `requests` IS INSTALLED EXPLICITLY AND THAT IS NOT INCIDENTAL. The tests are stdlib, but the module
  # under test imports chainlib, which imports third-party `requests` (chainlib.py:21). Without this step
  # the job still passed — because the runner image happens to ship `requests` — which made it green for a
  # reason nobody had established and unreproducible on a clean Python. There is no requirements file in
  # this repo, so the dependency is declared by name here.
  #
  # WHAT THIS DOES NOT BUY, stated because an earlier version of this comment claimed it did: this step
  # does NOT make a future third-party import fail loudly. It installs one named package into the image's
  # own site-packages — no version pin, no requirements file, no `--no-deps`, no clean-environment
  # isolation — so if chainlib later imports anything ubuntu-latest already ships, the job goes green on
  # the image exactly as before and nothing here notices. This declares one known dependency; it is not a
  # dependency GATE. Making it one needs a requirements file plus an isolated interpreter (venv with
  # `--no-site-packages` semantics, or a container), which is not set up here.
  preflight:
    name: Preflight gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the one third-party dependency chainlib needs
        run: python3 -m pip install --no-cache-dir requests

      - name: Verdict truth table (deployer_balances)
        # -O as well as plain: the import-time invariants use `raise`, not `assert`, precisely so that
        # optimised runs cannot strip them. Running both ways keeps that property honest.
        working-directory: script/deploy/preflight
        run: |
          python3 -m unittest test_deployer_balances -v
          python3 -O -m unittest test_deployer_balances

      - name: KEEP invariant (reset_deployment_records)
        # Added for #303. `KEEP` named the three bridge keys the redeploy reset must never touch, and was
        # referenced NOWHERE — one occurrence in the whole repo, its own assignment. Those keys survived only
        # because they happen to be absent from CLEAR_TOP/CLEAR_SECTIONS, which is coincidence, not
        # enforcement, while the name told reviewers the case was handled. Adding `bridgeAdapters` to
        # CLEAR_SECTIONS while extending the reset would have wiped the bridge record with nothing objecting.
        #
        # -O as well as plain, for the same reason as the job above: the invariant raises rather than asserts
        # so that optimised runs cannot strip it, and running both ways is what keeps that true.
        working-directory: script/deploy/preflight
        run: |
          python3 -m unittest test_reset_deployment_records -v
          python3 -O -m unittest test_reset_deployment_records

      - name: Published addresses match the deployment records
        # Added after DEPLOYED_ADDRESSES.md was found publishing 66 addresses that appear in NO deployment
        # record — contracts from a superseded generation. Stale entries still have code, so an integrator
        # reading the doc called a live contract the NAV does not use and got zeroes rather than an error.
        # A human noticed; nothing failed.
        #
        # Runs the guard both ways: `--self-test` pins the parser (including that the ★ fleet marker never
        # becomes part of an adapter name), then the plain run compares the committed doc to the committed
        # records. No network, no build, no secrets — both inputs are in the tree.
        working-directory: script/deploy/preflight
        run: |
          python3 published_addresses_guard.py --self-test
          python3 published_addresses_guard.py

      - name: Heartbeat-guard self-test (declared_heartbeat_guard --self-test)
        # Wired for the same reason as the step below, and after the same failure: a scope change to
        # `configured_chain_ids` made this module's own self-test exit 1 on a clean tree (its arm redirects
        # REPO at a synthetic tempdir with no `chains/` directory) and every CI check stayed green. Runs
        # without a build and without network — the `snapshots/pre/*.json` it needs are committed.
        #
        # `bytecode_audit.py --self-test` is deliberately NOT here: it indexes `out/`, so it exits 2 in a
        # job that does not compile. It belongs with a build, not with the config gates.
        run: python3 script/deploy/preflight/declared_heartbeat_guard.py --self-test

      - name: Config-guard self-test (preflight_config --self-test)
        # WIRED HERE BECAUSE ITS ABSENCE COST US ONE. `preflight_config.py --self-test` is the command the
        # module docstring tells an operator to run before a mainnet deploy to "prove the guards themselves",
        # and nothing ran it. A change to the base-allowlist rules broke two of its arms — the two that prove
        # the legitimate zero-baseAsset shape is expressible — and every CI check stayed green, because the
        # per-chain config happened to still pass. It exits 1 on any failed arm (verified), so this step
        # fails the build the way the unittest above does.
        run: python3 script/deploy/preflight/preflight_config.py --self-test

  # Format check
  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      # No submodule content needed: the check reads the committed gitlinks via `git ls-tree HEAD`, so this job
      # stays fast and cannot be confused by whatever a checkout happens to leave in lib/.
      - uses: actions/checkout@v4

      - name: foundry.lock matches the submodule gitlinks
        run: script/ci/check-foundry-lock.sh

  lint:
    name: Format
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - run: forge fmt --check
