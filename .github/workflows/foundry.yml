name: Foundry

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

env:
  FOUNDRY_PROFILE: default
  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
  MAINNET_URL: ${{ vars.KNODE_URL }}/ethereum?key=${{ secrets.KNODE_API_KEY }}
  ARBITRUM_URL: ${{ vars.KNODE_URL }}/arbitrum?key=${{ secrets.KNODE_API_KEY }}
  BASE_URL: ${{ vars.KNODE_URL }}/base?key=${{ secrets.KNODE_API_KEY }}
  OP_URL: ${{ vars.KNODE_URL }}/optimism?key=${{ secrets.KNODE_API_KEY }}
  GNOSIS_URL: ${{ vars.KNODE_URL }}/gnosis?key=${{ secrets.KNODE_API_KEY }}

jobs:
  # Compile once (via_ir is expensive) + EIP-170 size gate; share artifacts with all test jobs.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: true

      - name: Build
        run: forge build --sizes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-build
          path: |
            out/
            cache/
          retention-days: 1

  # Unit tests (mock-only, no RPC). Default profile.
  unit:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      - name: Unit tests
        run: forge test --no-match-path "*fork*" -vvv

  # Per-protocol fork tests (slow profile, RPC). Excludes the NAV integration harness.
  fork:
    name: Fork tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      - name: Fork tests
        env:
          FOUNDRY_PROFILE: slow
        run: forge test --match-path "*fork*" --no-match-path "test/integration/*" -vvv --threads 1

  # NAV integration tests (5 chains, heavy harness — own job for independent retries).
  integration:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      - name: Integration tests
        env:
          FOUNDRY_PROFILE: slow
        run: forge test --match-path "test/integration/*" -vvv --threads 1

  # Format check
  lint:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          cache: true

      - run: forge fmt --check
