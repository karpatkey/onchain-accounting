name: Foundry

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

# Minimal token scope: jobs only checkout/build/test/fmt; artifact up/download
# uses the Actions runtime token, not GITHUB_TOKEN. (CodeQL: limit GITHUB_TOKEN.)
permissions:
  contents: read

env:
  FOUNDRY_PROFILE: default
  # Single source of truth for the pinned Foundry version (forge's via_ir codegen is version-specific, so this
  # fixes the deterministic CREATE2 library pins — see foundry.toml). Bump here only; every job references it.
  FOUNDRY_VERSION: v1.7.1
  # Fork + integration tests resolve RPC via getAlchemyUrl() in test/TestEnvConfigurator.sol.
  # With no chain-specific *_URL vars set, it builds https://<network>.g.alchemy.com/v2/<key>.
  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

jobs:
  # Compile once (via_ir is expensive) + EIP-170 size gate; share artifacts with all test jobs.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - name: Build
        run: forge build --sizes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-build
          path: |
            out/
            cache/
          retention-days: 1

  # Unit tests (mock-only, no RPC). Default profile.
  unit:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      - name: Unit tests
        run: forge test --no-match-path "*fork*" -vvv

  # Per-protocol fork tests (slow profile, RPC). Excludes the NAV integration harness.
  fork:
    name: Fork tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      - name: Fork tests
        env:
          FOUNDRY_PROFILE: slow
        run: forge test --match-path "*fork*" --no-match-path "test/integration/*" -vvv --threads 1

  # NAV integration tests (5 chains, heavy harness — own job for independent retries).
  integration:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      - name: Integration tests
        env:
          FOUNDRY_PROFILE: slow
        run: forge test --match-path "test/integration/*" -vvv --threads 1

  # Format check
  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      # No submodule content needed: the check reads the committed gitlinks via `git ls-tree HEAD`, so this job
      # stays fast and cannot be confused by whatever a checkout happens to leave in lib/.
      - uses: actions/checkout@v4

      - name: foundry.lock matches the submodule gitlinks
        run: script/ci/check-foundry-lock.sh

  lint:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - run: forge fmt --check
