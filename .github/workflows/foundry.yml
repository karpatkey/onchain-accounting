name: Foundry

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

# Minimal token scope: jobs only checkout/build/test/fmt; artifact up/download
# uses the Actions runtime token, not GITHUB_TOKEN. (CodeQL: limit GITHUB_TOKEN.)
permissions:
  contents: read

env:
  FOUNDRY_PROFILE: default
  # Single source of truth for the pinned Foundry version (forge's via_ir codegen is version-specific, so this
  # fixes the deterministic CREATE2 library pins — see foundry.toml). Bump here only; every job references it.
  FOUNDRY_VERSION: v1.7.1
  # Fork + integration tests resolve RPC via getAlchemyUrl() in test/TestEnvConfigurator.sol.
  # With no chain-specific *_URL vars set, it builds https://<network>.g.alchemy.com/v2/<key>.
  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

jobs:
  # Compile once (via_ir is expensive) + EIP-170 size gate; share artifacts with all test jobs.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          # cache: false ONLY on this job. The restored Foundry cache lets `forge build` reuse
          # compilation state across runs, and that reuse changes the compilation scope enough to
          # change PriceFeedLib's emitted bytecode — and so the deterministic CREATE2 address the
          # LibraryPinConsistency test derives from it. Three different PriceFeedLib values appeared
          # across branches whose PriceFeedLib source was byte-identical, one of which changed no
          # file under src/ at all; a --force probe recovered the correct value every time.
          #
          # This is the job that matters: it produces the `out/` every test job downloads, so a wrong
          # value here is wrong everywhere downstream. Disabled rather than passing `forge build
          # --force` because it names the cause instead of overriding it — with nothing restored
          # there is no stale state to reuse. Identical compile cost either way.
          #
          # The test jobs keep `cache: true`: they consume this job's `out/` artifact and do not
          # recompile, so their cache cannot affect a pin value.
          cache: false

      # DO NOT REMOVE — this is not cruft, the build does not fit in the runner without it.
      #
      # A whole-program `via_ir` compile of this repo peaks at 7-8 GB RSS (measured locally with
      # `/usr/bin/time -v forge build --sizes` after `forge clean`; one run on a larger box reported 9.7 GB).
      # This repo is INTERNAL, so `ubuntu-latest` is a standard GitHub-hosted runner: 2 vCPU / 7 GB RAM.
      # The compile therefore needs more memory than the runner has, and every green Build on this repo has
      # been solc landing just under a line it structurally exceeds. A branch that adds even ~1 KB of
      # contract code in the wrong shape tips it, and the failure mode is silent and confusing: the log ends
      # at "Compiling NNN files with Solc 0.8.34" and the step exits 143 (SIGTERM, i.e. the kernel killed
      # solc) with no compiler error at all.
      #
      # The tempting "fixes" are all traps: lowering `optimizer_runs`, disabling `via_ir`, or changing
      # `bytecode_hash` would make the build pass AND silently change library bytecode, which moves the
      # deterministic CREATE2 pins that `foundry.toml [libraries]` and `script/utils/LibraryPins.sol` hard-code.
      # Never trade a pin move for a green build.
      #
      # Swap is slower than RAM but correct, and it fixes every branch at once. A cleaner fix, if the org
      # wants it: this org has Blacksmith runners registered (`blacksmith-4vcpu-ubuntu-2404` through
      # `blacksmith-32vcpu-ubuntu-2404`), so `runs-on:` could point at one with enough RAM and this step
      # could go away.
      - name: Add swap for the via_ir compile
        run: |
          echo "--- before ---"
          free -h
          swapon --show || true
          df -h /mnt | tail -1
          # `ubuntu-latest` already ships an ACTIVE /swapfile, so creating one at that path fails with
          # "fallocate failed: Text file busy" — and it is what main has been squeaking by on. Add a SECOND
          # swap area instead of resizing the existing one (resizing means swapoff first, which needs the
          # pages to fit in RAM and can fail on its own).
          #
          # It goes on /mnt, the runner's large ephemeral disk (~65 GB free), not on / (~20 GB, and shared
          # with the compile's own out/ + cache/ artifacts).
          sudo fallocate -l 8G /mnt/swapfile-ci
          sudo chmod 600 /mnt/swapfile-ci
          sudo mkswap /mnt/swapfile-ci
          sudo swapon /mnt/swapfile-ci
          echo "--- after ---"
          free -h
          swapon --show

      - name: Build
        run: forge build --sizes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-build
          path: |
            out/
            cache/
          retention-days: 1

  # Unit tests (mock-only, no RPC). Default profile.
  unit:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      - name: Unit tests
        run: forge test --no-match-path "*fork*" -vvv

  # Per-protocol fork tests (slow profile, RPC). Excludes the NAV integration harness.
  fork:
    name: Fork tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      - name: Fork tests
        env:
          FOUNDRY_PROFILE: slow
        run: forge test --match-path "*fork*" --no-match-path "test/integration/*" -vvv --threads 1

  # NAV integration tests (5 chains, heavy harness — own job for independent retries).
  integration:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: forge-build

      - name: Integration tests
        env:
          FOUNDRY_PROFILE: slow
        run: forge test --match-path "test/integration/*" -vvv --threads 1

  # Format check
  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      # No submodule content needed: the check reads the committed gitlinks via `git ls-tree HEAD`, so this job
      # stays fast and cannot be confused by whatever a checkout happens to leave in lib/.
      - uses: actions/checkout@v4

      - name: foundry.lock matches the submodule gitlinks
        run: script/ci/check-foundry-lock.sh

  lint:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - run: forge fmt --check
