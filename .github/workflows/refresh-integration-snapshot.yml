name: Refresh integration snapshot

on:
  workflow_dispatch:
    inputs:
      include_debank:
        description: "Run the Debank cross-check (uses DEBANK_API_KEY units)."
        required: false
        type: boolean
        default: true
  schedule:
    # Weekly Mondays at 06:00 UTC. Adjust as needed.
    - cron: "0 6 * * 1"

# Both triggers mutate the SAME branch and the SAME reused PR, so overlapping runs can fight:
# a bad run drafts the PR, then an older clean run still in flight reaches its restore step and
# marks that bad head ready again. cancel-in-progress is deliberately false — a half-cancelled
# refresh would leave accounts.json partly rewritten.
concurrency:
  group: refresh-integration-snapshot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # `gh label create` for the drift label writes through the issues API.
  issues: write

env:
  FOUNDRY_PROFILE: slow
  # Pinned Foundry version (keeps forge/via_ir bytecode + library pins reproducible — see foundry.toml).
  FOUNDRY_VERSION: v1.7.1
  # Sole RPC source. knode is deprecated, and the chain-specific *_URL overrides it used to set are
  # deliberately ABSENT rather than repointed: `getAlchemyUrl` prefers a *_URL env var whenever one is
  # present and otherwise builds https://<network>.g.alchemy.com/v2/<key> from this key, so setting
  # them to an Alchemy URL would only duplicate what the helper already does. Setting them to an empty
  # or malformed value would be actively worse than setting none — they would still be preferred, and
  # every RPC call would fail. This now matches foundry.yml, which has never set them.
  #
  # Do not reintroduce per-chain *_URL vars without measuring first: with knode at roughly a second
  # per call, the integration suite ran 35 minutes without completing, versus 12 seconds on Alchemy.
  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
  # Debank is opt-in. The workflow_dispatch input or the secret being absent both turn it off.
  DEBANK_API_KEY: ${{ (github.event_name == 'schedule' || inputs.include_debank) && secrets.DEBANK_API_KEY || '' }}

jobs:
  refresh:
    name: Refresh
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - name: Install jq + curl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq curl

      - name: Run refresh script
        # rc 0 = clean, 1 = partial snapshot (a chain did not regenerate), 2 = tolerance drift.
        # Do NOT fail the job here for 1 or 2: both produce a report that is the whole point of
        # the run, and failing at this step suppresses every step below it. Previously rc=1 did
        # exit here, so a partial snapshot surfaced as nothing but a red cron job — which is a
        # large part of why five consecutive reports went unread. The job still fails, at the
        # gate step at the end, with the two cases distinguished.
        id: refresh
        env:
          # No per-chain *_URL overrides. #208 removed them at workflow level because knode is deprecated
          # and `getAlchemyUrl` prefers ANY `*_URL` that is present — so keeping them here would have
          # silently reinstated at step level exactly what that PR removed, and reinstated the cost:
          # ~1s per call, an integration suite that ran 35 minutes without completing, versus 12 seconds
          # on Alchemy. `ALCHEMY_API_KEY` is inherited from the workflow-level `env`; it is repeated here
          # only because this step's `env` block shadows nothing else it needs.
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          # Debank is opt-in. The workflow_dispatch input or the secret being absent both turn it off.
          DEBANK_API_KEY: ${{ (github.event_name == 'schedule' || inputs.include_debank) && secrets.DEBANK_API_KEY || '' }}
        run: |
          set +e
          script/test/refresh-integration-snapshot.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ -f refresh-report.md ]]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
          fi
          # Anything outside the documented set is a genuine crash (missing jq, bad shell) and
          # has no report to show, so fail immediately and keep the exit code intact.
          if [[ $rc -ne 0 && $rc -ne 1 && $rc -ne 2 ]]; then
            exit $rc
          fi

      - name: Upload report artifact
        if: ${{ always() && steps.refresh.outputs.has_report == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: refresh-report.md
          if-no-files-found: ignore

      # Safe to open on a partial run: each chain is now all-or-nothing — a chain that did not
      # regenerate has its forkBlock rolled back and its DeBank reference left untouched — so
      # accounts.json is internally consistent even when incomplete, and the report names the
      # chains it skipped.
      - name: Open or update PR with refreshed snapshot
        id: cpr
        if: ${{ steps.refresh.outputs.has_report == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(integration): refresh fork blocks and Debank snapshots"
          title: "chore(integration): refresh fork blocks and Debank snapshots"
          body-path: refresh-report.md
          branch: chore/refresh-integration-snapshot
          base: main
          delete-branch: true
          add-paths: |
            test/integration/accounts.json

      # THE PR MUST CARRY THE VERDICT, NOT JUST THIS JOB.
      #
      # A PR opened with the default GITHUB_TOKEN does NOT trigger `pull_request` workflows — that is
      # GitHub's recursion guard, not a misconfiguration. foundry.yml therefore never runs on this PR
      # (no Build, no unit/fork/integration tests, no preflight gate), so it shows only the CodeQL and
      # Analyze checks and READS AS MERGEABLE while this job is failing on drift. Merging it in that
      # state ratifies the drift as the new expected baseline — the snapshot becomes the oracle, and a
      # genuine regression is recorded as intended behaviour.
      #
      # So on a bad run the PR is converted to a DRAFT and labelled. Draft is the part that matters:
      # it survives a page refresh, blocks the merge button, and is visible from the PR list, whereas
      # a failing job on a scheduled run is only visible to whoever opens the Actions tab.
      - name: Mark the PR as not-mergeable when the run was bad
        if: ${{ always() && steps.cpr.outputs.pull-request-number && steps.refresh.outputs.rc != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          RC: ${{ steps.refresh.outputs.rc }}
        run: |
          set -o pipefail
          if [ "$RC" = "1" ]; then
            reason="PARTIAL SNAPSHOT — at least one chain did not regenerate; its forkBlock was rolled back."
          else
            reason="TOLERANCE VIOLATIONS — at least one (chain x account) drifted past the configured tolerance."
          fi

          # Was this PR ALREADY flagged by an earlier run? Captured BEFORE the label is applied, so the
          # full write-up is posted once and later runs add a one-line "still failing" note instead. The
          # PR is reused across weekly runs (fixed branch), and #337 sat through six of them — without
          # this the same essay stacks up and buries the drift table maintainers actually need.
          already=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | index("snapshot-drift") // empty')

          gh pr ready "$PR" --undo || true
          gh label create snapshot-drift --color B60205 \
            --description "Refresh run reported drift or a partial snapshot" 2>/dev/null || true
          gh pr edit "$PR" --add-label snapshot-drift || true

          if [ -z "$already" ]; then
            gh pr comment "$PR" --body "$(printf '%s\n\n%s\n\n%s' \
              "**Converted to draft — do not merge as-is.** $reason" \
              "Merging this PR would rewrite the values the integration tests assert against, so a real regression would be recorded as the expected baseline. Read the drift table in the PR description, decide whether NAV or the reference source is wrong, and only then mark it ready." \
              "_Note: this PR cannot run the repo's test suite. GitHub does not trigger \`pull_request\` workflows for PRs opened with the default \`GITHUB_TOKEN\`, so the checks you see here are not a validation of the new snapshot._")" || true
          else
            gh pr comment "$PR" --body \
              "Still failing on \`$(date -u +%Y-%m-%d)\` — $reason The PR description above carries this run's drift table; the original explanation is earlier in this thread." || true
          fi

          # THE DRAFT IS THE ONLY OPERATION THAT ACTUALLY BLOCKS A MERGE, so it is the only one allowed
          # to fail the step. Label and comment stay best-effort above: losing them is cosmetic, losing
          # the draft silently would leave the PR looking mergeable while this run reported rc=$RC —
          # exactly the state this whole step exists to prevent.
          is_draft=$(gh pr view "$PR" --json isDraft --jq .isDraft)
          if [ "$is_draft" != "true" ]; then
            echo "::error::PR #$PR is NOT in draft after rc=$RC — it still reads as mergeable. Check the"
            echo "::error::workflow's pull-requests: write permission and the gh CLI output above."
            exit 1
          fi
          echo "PR #$PR is draft=true and labelled snapshot-drift (rc=$RC)."

      - name: Restore the PR to mergeable after a clean run
        if: ${{ steps.cpr.outputs.pull-request-number && steps.refresh.outputs.rc == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh pr edit "$PR" --remove-label snapshot-drift || true
          gh pr ready "$PR" || true

      - name: Fail if snapshot incomplete
        if: ${{ steps.refresh.outputs.rc == '1' }}
        run: |
          echo "Refresh script reported a PARTIAL snapshot — at least one chain did not"
          echo "regenerate its NAV (zero SNAPSHOT lines, a down sequencer, stale prices, or a"
          echo "forge failure). Those chains were rolled back and excluded from the comparison;"
          echo "see the 'Incomplete run' banner in refresh-report.md for which ones."
          echo "Do NOT read the drift table as a complete result."
          exit 1

      - name: Fail if tolerance violations
        if: ${{ steps.refresh.outputs.rc == '2' }}
        run: |
          echo "Refresh script reported tolerance violations — see refresh-report.md."
          exit 2
