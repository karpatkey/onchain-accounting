name: Refresh integration snapshot

on:
  workflow_dispatch:
    inputs:
      include_debank:
        description: "Run the Debank cross-check (uses DEBANK_API_KEY units)."
        required: false
        type: boolean
        default: true
  schedule:
    # Weekly Mondays at 06:00 UTC. Adjust as needed.
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

env:
  FOUNDRY_PROFILE: slow
  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
  MAINNET_URL: ${{ vars.KNODE_URL }}/ethereum?key=${{ secrets.KNODE_API_KEY }}
  ARBITRUM_URL: ${{ vars.KNODE_URL }}/arbitrum?key=${{ secrets.KNODE_API_KEY }}
  BASE_URL: ${{ vars.KNODE_URL }}/base?key=${{ secrets.KNODE_API_KEY }}
  OP_URL: ${{ vars.KNODE_URL }}/optimism?key=${{ secrets.KNODE_API_KEY }}
  GNOSIS_URL: ${{ vars.KNODE_URL }}/gnosis?key=${{ secrets.KNODE_API_KEY }}
  # Debank is opt-in. The workflow_dispatch input or the secret being absent both turn it off.
  DEBANK_API_KEY: ${{ (github.event_name == 'schedule' || inputs.include_debank) && secrets.DEBANK_API_KEY || '' }}

jobs:
  refresh:
    name: Refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
          cache: true

      - name: Install jq + curl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq curl

      - name: Run refresh script
        # Tolerance violations exit 2; other failures exit 1. We want the report-PR step to
        # still run on tolerance violations, but a hard failure (e.g., RPC down) should fail
        # the job. Capture the exit code and decide.
        id: refresh
        run: |
          set +e
          script/test/refresh-integration-snapshot.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ $rc -ne 0 && $rc -ne 2 ]]; then
            exit $rc
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: refresh-report.md

      - name: Open or update PR with refreshed snapshot
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(integration): refresh fork blocks and Debank snapshots"
          title: "chore(integration): refresh fork blocks and Debank snapshots"
          body-path: refresh-report.md
          branch: chore/refresh-integration-snapshot
          base: main
          delete-branch: true
          add-paths: |
            test/integration/accounts.json

      - name: Fail if tolerance violations
        if: ${{ steps.refresh.outputs.rc == '2' }}
        run: |
          echo "Refresh script reported tolerance violations — see refresh-report.md."
          exit 2
