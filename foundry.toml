[profile.default]
src = "src"
out = "out"

fs_permissions = [
  { access = "read-write", path = "script" },
  { access = "read-write", path = "out" },
  { access = "read-write", path = "safe-transactions" },
  { access = "read-write", path = "test/integration" },
]
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]


# Default behaviour changed on commit https://github.com/foundry-rs/foundry/commit/39f13df8971b02f5961d4fd2cb278f44e19a717a
optimizer = true
optimizer_runs = 200
via_ir = true

# Pin the compiler AND strip the appended source-metadata hash so the external-library bytecode —
# and therefore the deterministic CREATE2 addresses the `libraries` array below pins — are stable
# and reproducible. Two independent axes shift that bytecode if left unpinned:
#   - solc_version: forge otherwise selects the latest pragma-compatible solc, whose codegen +
#     metadata differ, moving the CREATE2 address.
#   - bytecode_hash: the default ("ipfs") appends a hash of ALL source in the contract's import graph
#     (comments included), so an unrelated doc/comment edit to e.g. PositionKind.sol — pulled in
#     transitively by NavRegistryLib via INAVCalculator — would shift the library address. "none"
#     drops that trailer, so the address tracks only the actual compiled code + compiler.
# Either drift leaves NAVCalculator linked to an address with no code → init reverts on a fresh
# deploy. CI's LibraryPinConsistency test re-derives both pins from current bytecode and fails if
# they ever drift again. See docs/decisions/0010-meta-balance-adapters.md (EIP-170 library split).
solc_version = "0.8.34"
bytecode_hash = "none"

# Pre-link the external libraries at their deterministic CREATE2 addresses so type(NAVCalculator).creationCode
# contains the real library addresses rather than __$...$__ placeholders.  Each address is derived from the
# canonical CREATE2 factory (0x4e59...956C) with salt keccak256("<LibName>" ++ uint256(1)).
# Deploy script 01_2_DeployNAVImplementation.s.sol deploys both libraries to these addresses before deploying
# NAVCalculator, so the Safe TX batch is self-contained.
#   - PriceFeedLib   : price-feed selection/management (from Prices) PLUS NAVCalculator's read/compute engine
#                      (NAV, positions, health, value) — see ADR 0010.
#   - NavRegistryLib : asset-registry + balance-oracle-registry storage mutations (extracted from NAVCalculator /
#                      Balances) to keep NAVCalculator under EIP-170. See ADR 0010.
libraries = [
  "src/prices/PriceFeedLib.sol:PriceFeedLib:0xC24Ab894277c63e97166395647c4A537A78edb41",
  "src/nav/NavRegistryLib.sol:NavRegistryLib:0x02F27E28452E6F419b97935f6346381E2b5003B1",
]

# Treat compiler warnings as errors (fail build). Warnings from lib/ are ignored.
# See: https://book.getfoundry.sh/reference/config/solidity-compiler
# deny = "warnings"
ignored_warnings_from = ["lib"]

# Dev-only profile for the local-anvil fork sim (script/development). Clears the library pins so
# `forge script` AUTO-DEPLOYS + auto-links PriceFeedLib/NavRegistryLib instead of linking against the
# fixed [profile.default] addresses. Those pins are only valid for the exact solc they were generated
# under; a newer local solc produces different lib bytecode → different CREATE2 address → the linked
# address has no code → init reverts. Auto-deploy sidesteps the mismatch on dev forks. Selected via
# FOUNDRY_PROFILE=dev in script/development/deploy/deploy.sh; inherits everything else from default.
# Prod and CI use the default profile (pinned, deterministic addresses).
[profile.dev]
libraries = []

# Linter runs on `forge build`; issues are printed and fail the build when deny includes warnings.
[lint]
no_match_test = "upgrade"

[profile.coverage]
# Exclude script folder from coverage reports (regex pattern)
no_match_coverage = "^script/"

# Fuzz testing configuration
[fuzz]
runs = 2000
max_test_rejects = 65536

# Invariant testing configuration
[invariant]
runs = 256
depth = 15
fail_on_revert = false
show_metrics = true

# Fork tests: single thread + throttle RPC to avoid rate limits. Use with FOUNDRY_PROFILE=slow.
# threads: see book.getfoundry.sh/reference/config/testing (FOUNDRY_THREADS)
# compute_units_per_second: mirrors --compute-units-per-second (throttles RPC during fork; default 330)
[profile.slow]
threads = 1
# The integration harness in test/integration/IntegrationFromConfigBase.fork.sol
# deploys ~30 balance adapters + registers ~28 assets in a single setUp call
# frame. EVM memory expansion (quadratic gas cost) accumulates and trips
# MemoryOOG against the default 1 GiB script gas_limit. Bump both to 16 GiB
# under the slow profile so the integration tests have headroom; default
# profile (unit tests) is unaffected.
gas_limit = 17179869184
memory_limit = 17179869184


[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }