[profile.default]
src = "src"
out = "out"

fs_permissions = [
  { access = "read-write", path = "script" },
  { access = "read-write", path = "out" },
  { access = "read-write", path = "safe-transactions" },
  { access = "read-write", path = "test/integration" },
  # READ-ONLY, and only so LibraryPinConsistencyTest can hash the sources an artifact in `out/`
  # records having been compiled from. A cheatcode permission, never passed to solc, so it cannot
  # affect emitted bytecode or the `libraries` pins below.
  { access = "read", path = "src" },
  # `lib` matters more now than it did: the freshness assertion also covers NAVCalculator, and 29
  # of its 55 recorded sources are submodule files under `lib/`. The grant itself is NOT new —
  # it predates this change, and an earlier revision of this comment claimed otherwise while
  # adding a second, identical entry.
  { access = "read", path = "lib" },
]
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]


# Default behaviour changed on commit https://github.com/foundry-rs/foundry/commit/39f13df8971b02f5961d4fd2cb278f44e19a717a
optimizer = true
optimizer_runs = 200
via_ir = true

# `dynamic_test_linking = true` was here and was REMOVED after measuring it. Do not reinstate it without
# re-measuring, because it buys nothing and costs correctness:
#
#   - Measured cost, both loops, each arm with its own cold baseline (toggling the flag invalidates the
#     cache, so a warm-vs-cold comparison measures only the toggle): a harness-only edit under
#     `--match-contract NavBacktest` + `FOUNDRY_PROFILE=slow` recompiled 1 file in 88s with the flag and
#     1 file in 85s without; under full-suite scope it recompiled NOTHING in 8s with and NOTHING in 6s
#     without. Ordinary incremental compilation already delivers what the flag advertises. Only the cold
#     build differed (479s vs 594s), and cold builds are not the iteration loop.
#   - Under the flag, `type(X).creationCode` compiles to a `vm.getCode` call — a read of the build
#     artifact from disk AT TEST TIME. So `LibraryPinConsistency` stops attesting the tree and starts
#     attesting whatever `out/` happens to hold. That is not theoretical: this PR's CI reported
#     `PriceFeedLib = 0xeA694009…` instead of main's `0x8b7e4fA9…`, because CI's unit job downloads the
#     build job's artifacts rather than building, and those come off a repo-wide sticky cache keyed only
#     by repository. Stale artifact in, stale pin out, guard green.
#   - It also routes `new` in test sources through `vm.deployCode`, FILE-scoped rather than
#     test-contract-scoped, which makes constructor-revert payloads a property of the harness instead of
#     the contract. See `test/prices/protocols/ETHPlus_CustomPriceFeed.t.sol`.

# Pin the compiler, EVM target AND strip the appended source-metadata hash so the external-library
# bytecode — and therefore the deterministic CREATE2 addresses the `libraries` array below pins — are
# stable and reproducible. Three independent axes shift that bytecode if left unpinned:
#   - solc_version: forge otherwise selects the latest pragma-compatible solc, whose codegen +
#     metadata differ, moving the CREATE2 address.
#   - evm_version: forge otherwise applies a version-dependent default (e.g. forge 1.7.1 → "osaka"),
#     so the same source compiles to different bytecode on a machine/CI whose forge defaults differ —
#     which silently moves the CREATE2 address. Pin "cancun": the highest EVM version supported across
#     all target chains (Ethereum, Gnosis, Base, Optimism, Arbitrum).
#   - forge version: forge's `via_ir` codegen is version-specific, so the library bytecode (and pins)
#     differ between forge releases. CI pins `foundry-toolchain` to `version: v1.7.1` (.github/workflows,
#     via the FOUNDRY_VERSION env var), and the LibraryPins addresses are generated under that exact
#     version. The workflow tag `v1.7.1` and the foundryup arg `1.7.1` are the SAME Foundry release
#     (forge 1.7.1) — to reproduce the pins locally, install it: `foundryup --install 1.7.1`. A different
#     local forge will compute different pins.
#   - bytecode_hash: the default ("ipfs") appends a hash of ALL source in the contract's import graph
#     (comments included), so an unrelated doc/comment edit to e.g. PositionKind.sol — pulled in
#     transitively by NAVRegistryLib via INAVCalculator — would shift the library address. "none"
#     drops that trailer, so the address tracks only the actual compiled code + compiler.
# Any drift leaves NAVCalculator linked to an address with no code → init reverts on a fresh
# deploy. CI's LibraryPinConsistency test re-derives both pins from current bytecode and fails if
# they ever drift again. See docs/decisions/0010-meta-balance-adapters.md (EIP-170 library split).
solc_version = "0.8.34"
evm_version = "cancun"
bytecode_hash = "none"

# Pre-link the external libraries at their deterministic CREATE2 addresses so type(NAVCalculator).creationCode
# contains the real library addresses rather than __$...$__ placeholders.  Each address is derived from the
# canonical CREATE2 factory (0x4e59...956C) with salt keccak256("<LibName>" ++ uint256(1)).
# Deploy script 01_2_DeployNAVImplementation.s.sol deploys both libraries to these addresses before deploying
# NAVCalculator, so the Safe TX batch is self-contained.
#   - PriceFeedLib   : price-feed selection/management (from Prices) PLUS NAVCalculator's read/compute engine
#                      (NAV, positions, health, value) — see ADR 0010.
#   - NAVRegistryLib : asset-registry + balance-oracle-registry storage mutations (extracted from NAVCalculator /
#                      Balances) to keep NAVCalculator under EIP-170. See ADR 0010.
libraries = [
  "src/prices/PriceFeedLib.sol:PriceFeedLib:0x713e69954e11c2eD19dBB84950674D6a68DBfebc",
  "src/nav/NAVRegistryLib.sol:NAVRegistryLib:0x55b6AA29D296Eb2Ee0e7b76686eaA2e479CA3511",
]

# Treat compiler warnings as errors (fail build). Warnings from lib/ are ignored.
# See: https://book.getfoundry.sh/reference/config/solidity-compiler
# deny = "warnings"
ignored_warnings_from = ["lib"]

# Dev-only profile for the local-anvil fork sim (script/development). Clears the library pins so
# `forge script` AUTO-DEPLOYS + auto-links PriceFeedLib/NAVRegistryLib instead of linking against the
# fixed [profile.default] addresses. Those pins are only valid for the exact solc they were generated
# under; a newer local solc produces different lib bytecode → different CREATE2 address → the linked
# address has no code → init reverts. Auto-deploy sidesteps the mismatch on dev forks. Selected via
# FOUNDRY_PROFILE=dev in script/development/deploy/deploy.sh; inherits everything else from default.
# Prod and CI use the default profile (pinned, deterministic addresses).
[profile.dev]
libraries = []

# Fast local dev / unit-test profile. Inherits [profile.default] and disables
# every axis that slows compilation or ties bytecode to a specific pin:
# optimizer, build_info, ast, extra_output, and the pinned `libraries` array.
# PriceFeedLib / NAVRegistryLib are auto-deployed + auto-linked by forge instead.
#
# via_ir=true (with optimizer=false) is REQUIRED: legacy codegen hits
# "Stack too deep" at src/prices/PriceFeedLib.sol:491. via_ir without the
# optimizer skips the expensive Yul optimization pipeline but uses the
# IR-based codegen that avoids the stack limit.
#
# IMPORTANT: this profile is NOT bytecode-compatible with [profile.default].
# Library CREATE2 addresses, optimizer output, and via_ir codegen all differ, so
# any artifact produced here is invalid for deploys and for the LibraryPinConsistency
# test (which re-derives pins from default-profile bytecode). Use it only for local
# iteration and unit tests. CI keeps the default profile. Unoptimized NAVCalculator
# exceeds EIP-170's 24576-byte limit, so bump code_size_limit to give it headroom.
[profile.lite]
via_ir = true   # required: legacy codegen hits stack-too-deep in PriceFeedLib
optimizer = false
build_info = false
ast = false
extra_output = []
libraries = []
code_size_limit = 393216

# Linter runs on `forge build`; issues are printed and fail the build when deny includes warnings.
#
# `no_match_test = "upgrade"` used to sit here. It was DELETED rather than relocated: `no_match_test` is a
# test-filter key with no meaning under `[lint]`, so forge ignored it and printed
# `Warning: Found unknown 'no_match_test' config key in section 'lint'` on every single build.
# Deleting it is behaviour-preserving, because it was already inert. Moving it to `[profile.default]` — where
# it would be valid — would have STARTED skipping `test_upgrade` and `test_upgrade_notAuthorized`
# (test/nav/NAVCalculator.upgrade.t.sol), silently dropping the only coverage of the UUPS upgrade path and its
# authorization check. That is a coverage regression disguised as a config tidy-up, so if the intent is ever
# to skip those tests it should be a deliberate, reviewed change and not a resurrection of this line.
[lint]

[profile.coverage]
# Exclude script folder from coverage reports (regex pattern)
no_match_coverage = "^script/"

# Fuzz testing configuration
[fuzz]
runs = 2000
max_test_rejects = 65536

# Invariant testing configuration
[invariant]
runs = 256
depth = 15
fail_on_revert = false
show_metrics = true

# Fork tests: single thread + throttle RPC to avoid rate limits. Use with FOUNDRY_PROFILE=slow.
# threads: see book.getfoundry.sh/reference/config/testing (FOUNDRY_THREADS)
# compute_units_per_second: mirrors --compute-units-per-second (throttles RPC during fork; default 330)
[profile.slow]
threads = 1
# The integration harness in test/integration/IntegrationFromConfigBase.fork.sol
# deploys ~30 balance adapters + registers ~28 assets in a single setUp call
# frame. EVM memory expansion (quadratic gas cost) accumulates and trips
# MemoryOOG against the default 1 GiB script gas_limit. Both were bumped to
# 16 GiB under the slow profile so the integration tests have headroom;
# default profile (unit tests) is unaffected.
gas_limit = 17179869184
memory_limit = 68719476736
# MEMORY ONLY, 16 GiB -> 64 GiB on 2026-09-17. `script/manage/RegisterAssets.s.sol` died with a bare
# `EvmError: MemoryOOG` under the 16 GiB value at 55 configured assets / 7 planned actions, having run fine at
# 52 assets / 5 actions days earlier. The cause is the one that script's own docstring documents — `ConfigReader`
# re-reads the ENTIRE per-chain JSON for EVERY FIELD of EVERY ASSET and Solidity frees nothing — so the ceiling
# is crossed by the config file GROWING, not by the batch. A raised ceiling, not a fix: the fix is caching the
# parsed config per run (#318), which touches every deploy script.
#
# `gas_limit` IS DELIBERATELY LEFT AT 16 GiB. An earlier revision raised it in the same edit, which review
# caught as unevidenced: the failure measured was MemoryOOG, not gas exhaustion, so nothing justified it. It is
# also not free — `.github/workflows/foundry.yml` runs the fork and integration jobs under this profile, and a
# gas ceiling ~1,500x a mainnet block means no fork test can observe a gas regression (this PR's own
# empty-account Aave V4 read is ~701k). Raise it only against a measured gas failure, and say what it was.
#
# Both are EVM-level caps, not compiler settings: they cannot move bytecode and so cannot move the CREATE2
# library pins. Raising them is safe in a way that editing [libraries] never is — confirmed by re-running both
# pin suites after the change.


[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }